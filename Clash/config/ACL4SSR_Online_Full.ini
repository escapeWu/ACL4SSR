; >> 基础核心分组 <<

; 🚀 节点选择 (保持不变)
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]☑️ 手动切换`[]🏠 自建家宽`[]☁️ 自建普通`[]💎 IEPL专线`[]DIRECT

; ☑️ 手动切换 (保持不变)
custom_proxy_group=☑️ 手动切换`select`.*
; ♻️ 自动选择 [已修改]
custom_proxy_group=♻️ 自动选择`url-test`^(?!.*IEPL).*`http://www.gstatic.com/generate_204`300,,50

; 2. 自建家宽 [已修改]
custom_proxy_group=🏠 自建家宽`url-test`(?=.*(shanCW家宽))(?!.*IEPL)`http://www.gstatic.com/generate_204`300,,50

; 3. 自建普通 (保持不变)
custom_proxy_group=☁️ 自建普通`url-test`(RNDC|RNCA)`http://www.gstatic.com/generate_204`300,,50
; 1. IEPL专线 (保持不变)
custom_proxy_group=💎 IEPL专线`url-test`IEPL`http://www.gstatic.com/generate_204`300,,50

; >> 功能策略组 <<
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]☑️ 手动切换


custom_proxy_group=🤖 OpenAi`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择`[]DIRECT`(NF|奈飞|解锁|Netflix|NETFLIX|Media|MITM)
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]DIRECT`(MITM|emby|Emby)
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📢 谷歌FCM`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]DIRECT

; 广告与应用
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
; 兜底
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]☑️ 手动切换

enable_rule_generator=true
overwrite_original_rules=true





