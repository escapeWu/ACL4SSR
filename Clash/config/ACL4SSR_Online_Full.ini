ruleset=🐟 漏网之鱼,[]FINAL

; >> 基础核心分组 <<
; 1. IEPL专线 (自动测速选择)
custom_proxy_group=💎 IEPL专线`url-test`IEPL`http://www.gstatic.com/generate_204`300,,50
; 2. 自建家宽 (自动测速选择) - 匹配 RainYun 或不含 IEPL 的家宽节点
custom_proxy_group=🏠 自建家宽`url-test`(RainYun|(?=.*家宽)(?!.*IEPL))`http://www.gstatic.com/generate_204`300,,50
; 3. 自建普通 (自动测速选择) - 匹配 RNDC 或 RNCA
custom_proxy_group=☁️ 自建普通`url-test`(RNDC|RNCA)`http://www.gstatic.com/generate_204`300,,50

; >> 主策略组 <<
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]💎 IEPL专线`[]🏠 自建家宽`[]☁️ 自建普通`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=☑️ 手动切换`select`.*

; >> 功能策略组 <<
custom_proxy_group=📲 电报消息`select`[]💎 IEPL专线`[]🚀 节点选择`[]♻️ 自动选择`[]🏠 自建家宽`[]☁️ 自建普通`[]DIRECT
custom_proxy_group=🤖 OpenAi`select`[]🏠 自建家宽`[]💎 IEPL专线`[]🚀 节点选择`[]☁️ 自建普通`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]💎 IEPL专线`[]🚀 节点选择`[]♻️ 自动选择`[]🏠 自建家宽`[]☁️ 自建普通`[]DIRECT
custom_proxy_group=🎥 奈飞视频`select`[]🏠 自建家宽`[]💎 IEPL专线`[]🚀 节点选择`[]☁️ 自建普通`[]DIRECT`(NF|奈飞|解锁|Netflix|NETFLIX|Media|MITM)
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]💎 IEPL专线`[]🏠 自建家宽`[]☁️ 自建普通`[]DIRECT`(MITM|emby|Emby)
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🚀 节点选择`[]☑️ 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]💎 IEPL专线`[]☁️ 自建普通
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]💎 IEPL专线`[]☁️ 自建普通
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`[]💎 IEPL专线`[]☁️ 自建普通
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]💎 IEPL专线`[]🚀 节点选择`[]☁️ 自建普通

; 广告与应用
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT

; 兜底
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]☑️ 手动切换

enable_rule_generator=true
overwrite_original_rules=true
